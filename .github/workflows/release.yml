  build_artifacts:
    name: Build ${{ matrix.rust-target }} artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # == Windows ==
          - rust-target: x86_64-pc-windows-msvc
            os: windows-latest
            archive-extension: zip
            binary-extension: ".exe"
          - rust-target: aarch64-pc-windows-msvc
            os: windows-latest
            archive-extension: zip
            binary-extension: ".exe"
          # == macOS ==
          - rust-target: x86_64-apple-darwin
            os: macos-latest
            archive-extension: tar.gz
            binary-extension: ""
          - rust-target: aarch64-apple-darwin
            os: macos-latest
            archive-extension: tar.gz
            binary-extension: ""
          # == Linux ==
          - rust-target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive-extension: tar.gz
            binary-extension: ""
          - rust-target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive-extension: tar.gz
            binary-extension: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.rust-target }}

      - name: Install Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install pkg-config libssl-dev

      - name: Install Dependencies
        if: runner.os == 'macOS'
        run: brew install openssl pkg-config

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
              export PKG_CONFIG_SYSROOT_DIR=/
          fi
          cargo --locked build -p sprocket --bin sprocket -p wdl-doc-bin --bin wdl-doc --release --target ${{ matrix.rust-target }}

      - name: Compress artifacts
        if: runner.os == 'Windows'
        working-directory: ./target/${{ matrix.rust-target }}/release
        run: 7z a sprocket-${{ github.ref_name }}-${{ matrix.rust-target }}.zip sprocket.exe

      - name: Compress artifacts
        if: runner.os != 'Windows'
        working-directory: ./target/${{ matrix.rust-target }}/release
        run: tar -czvf sprocket-${{ github.ref_name }}-${{ matrix.rust-target }}.tar.gz sprocket

      - name: Update the GH release with the new artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./target/${{ matrix.rust-target }}/release/sprocket-${{ github.ref_name }}-${{ matrix.rust-target }}.${{ matrix.archive-extension }}
            ./target/${{ matrix.rust-target }}/release/sprocketup-${{ matrix.rust-target }}${{ matrix.binary-extension }}
