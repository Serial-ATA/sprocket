<!DOCTYPE html><html x-data="{ DEFAULT_THEME: 'dark'}" x-bind:class="(localStorage.getItem('theme') ?? DEFAULT_THEME) === 'light' ? 'light' : 'dark'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content=""><title>Lints</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script type="module" src="index.js"></script></head><body class="body--base"><div class="main__container" x-data="App"><div id="top-bar"><div class="relative w-1/2 h-10"><input id="searchbox" x-model.debounce="search" type="text" placeholder="Search..." class="left-sidebar__searchbox" @keydown="this.search = event.target.textContent.toLowerCase()"><img src="assets/search.svg" class="absolute left-2 top-1/2 -translate-y-1/2 size-6 pointer-events-none block light:hidden" alt="Search icon"><img src="assets/search.light.svg" class="absolute left-2 top-1/2 -translate-y-1/2 size-6 pointer-events-none hidden light:block" alt="Search icon"><img src="assets/x-mark.svg" class="absolute right-2 top-1/2 -translate-y-1/2 size-6 hover:cursor-pointer block light:hidden" alt="Clear icon" x-show="search !== ''" x-on:click="search = ''"><img src="assets/x-mark.light.svg" class="absolute right-2 top-1/2 -translate-y-1/2 size-6 hover:cursor-pointer hidden light:block" alt="Clear icon" x-show="search !== ''" x-on:click="search = ''"></div><div class="flex flex-row-reverse items-start justify-between"><button x-on:click="
                            document.documentElement.classList.toggle('light')
                            localStorage.setItem('theme', document.documentElement.classList.contains('light') ? 'light' : 'dark')
                            " class="border border-slate-700 rounded-md h-8 flex items-center justify-center text-slate-300 text-lg w-8 cursor-pointer hover:border-slate-500">☀︎</button></div></div><div id="tab-list" class="flex overflow-hidden gap-4"><button class="tab" :class="{ 'active': tab === 'wdl-lint' }" :class="tab === 'wdl-lint' ? 'bg-gray-300' : 'bg-transparent'" @click="switchTab('wdl-lint')" class="px-4 py-3.5 transition-colors duration-300 hover:border-slate-500 focus:outline-none active:border-slate-700">wdl-lint</button><button class="tab" :class="{ 'active': tab === 'wdl-analysis' }" :class="tab === 'wdl-analysis' ? 'bg-gray-300' : 'bg-transparent'" @click="switchTab('wdl-analysis')" class="px-4 py-3.5 transition-colors duration-300 hover:border-slate-500 focus:outline-none active:border-slate-700">wdl-analysis</button></div><div class="border-none"><div x-show="tab === 'wdl-lint'"><div class="lint-list-options"><div id="tag-filter" class="dropdown main__badge-container" x-data="{ open: false }" @focusout="if (!$el.contains($event.relatedTarget)) open = false"><button type="button" class="main__badge" @click="open = !open"><span class="main__badge-text">Tags</span></button><ul class="dropdown-menu" x-show="open"><li class="checkbox"><button class="reset-all" @click="activeTags = ['Completeness', 'Naming', 'Spacing', 'Style', 'Clarity', 'Portability', 'Correctness', 'Sorting', 'Deprecated', 'Documentation', 'SprocketCompatibility']">All</button></li><li class="checkbox"><button class="reset-none" @click="activeTags = []">None</button></li><li role="separator" class="divider"></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="Completeness" :checked="activeTags.includes('Completeness')" @click="toggleTag('Completeness')"></input>Completeness</label></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="Naming" :checked="activeTags.includes('Naming')" @click="toggleTag('Naming')"></input>Naming</label></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="Spacing" :checked="activeTags.includes('Spacing')" @click="toggleTag('Spacing')"></input>Spacing</label></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="Style" :checked="activeTags.includes('Style')" @click="toggleTag('Style')"></input>Style</label></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="Clarity" :checked="activeTags.includes('Clarity')" @click="toggleTag('Clarity')"></input>Clarity</label></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="Portability" :checked="activeTags.includes('Portability')" @click="toggleTag('Portability')"></input>Portability</label></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="Correctness" :checked="activeTags.includes('Correctness')" @click="toggleTag('Correctness')"></input>Correctness</label></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="Sorting" :checked="activeTags.includes('Sorting')" @click="toggleTag('Sorting')"></input>Sorting</label></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="Deprecated" :checked="activeTags.includes('Deprecated')" @click="toggleTag('Deprecated')"></input>Deprecated</label></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="Documentation" :checked="activeTags.includes('Documentation')" @click="toggleTag('Documentation')"></input>Documentation</label></li><li class="checkbox"><label @mousedown.prevent><input type="checkbox" name="SprocketCompatibility" :checked="activeTags.includes('SprocketCompatibility')" @click="toggleTag('SprocketCompatibility')"></input>SprocketCompatibility</label></li></ul></div><div id="version-filter" class="dropdown main__badge-container" x-data="{ open: false }" @focusout="if (!$el.contains($event.relatedTarget)) open = false"><button type="button" class="main__badge" @click="open = !open"><span class="main__badge-text">Versions</span></button><ul class="dropdown-menu" x-show="open"><li class="checkbox"><label><input type="checkbox"></input>TODO</label></li></ul></div></div><div class="rule__container"><template x-for="lint in $store.allLints" :key="lint.id"><article :id="lint.id" x-show="isVisible(lint)"><input :id="`label-${lint.id}`" type="checkbox"><label x-bind:for="`label-${lint.id}`"><h2 class="rule-section-header"><div class="panel-title-name" :id="`rule-${lint.id}`" x-text="lint.id"></div><span class="label doc-folding"></h2></label><div class="rule-description" x-html="lint.descriptionHtml"></div></article></template></div></div><div x-show="tab === 'wdl-analysis'"><div class="lint-list-options"><div id="version-filter" class="dropdown main__badge-container" x-data="{ open: false }" @focusout="if (!$el.contains($event.relatedTarget)) open = false"><button type="button" class="main__badge" @click="open = !open"><span class="main__badge-text">Versions</span></button><ul class="dropdown-menu" x-show="open"><li class="checkbox"><label><input type="checkbox"></input>TODO</label></li></ul></div></div><div class="rule__container"><template x-for="lint in $store.allAnalysisLints" :key="lint.id"><article :id="lint.id" x-show="isVisible(lint)"><input :id="`label-${lint.id}`" type="checkbox"><label x-bind:for="`label-${lint.id}`"><h2 class="rule-section-header"><div class="panel-title-name" :id="`rule-${lint.id}`" x-text="lint.id"></div><span class="label doc-folding"></h2></label><div class="rule-description" x-html="lint.descriptionHtml"></div></article></template></div></div></div></div></body></html>
